<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donors - Manitham Trust</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f9f9f9;
    color: #222;
  }

  .title {
    text-align: center;
    font-size: 48px;
    font-weight: bold;
    padding: 25px 0;
    color: #2c3e50;
    letter-spacing: 3px;
    background-color: #ecf0f1;
  }

  .back-btn-container {
    text-align: center;
    margin: 10px 0;
  }

  .back-btn {
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    transition: 0.3s;
  }

  .back-btn:hover {
    background-color: #2980b9;
  }

  .donor-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 20px auto;
    max-width: 1000px;
    gap: 20px;
  }

  .donor-card {
    display: flex;
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    width: 300px;
    align-items: center;
  }

  .donor-photo {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    object-fit: cover;
    margin-right: 15px;
    border: 2px solid #27ae60;
  }

  .donor-info h3 {
    margin: 0 0 5px 0;
    font-size: 18px;
    color: #27ae60;
  }

  .donor-info p {
    margin: 3px 0;
    font-size: 14px;
  }
</style>
</head>
<body>

  <div class="title">Donors - Manitham Trust</div>

  <div class="back-btn-container">
    <button class="back-btn" onclick="location.href='index.html'">← Back to Dashboard</button>
  </div>

  <div class="donor-container" id="donorContainer">
    <!-- Donors will be dynamically inserted here -->
  </div>

  <script>
    // This array will be filled by Home page or Admin input
    const donors = []; // Empty for now

    const container = document.getElementById("donorContainer");

    // Function to display donors dynamically
    function renderDonors(donorArray) {
      container.innerHTML = ""; // Clear existing cards
      donorArray.forEach(donor => {
        const card = document.createElement("div");
        card.className = "donor-card";
        card.innerHTML = `
          <img class="donor-photo" src="${donor.photo}" alt="${donor.name}">
          <div class="donor-info">
            <h3>${donor.name}</h3>
            <p><strong>Age:</strong> ${donor.age}</p>
            <p><strong>Occupation:</strong> ${donor.occupation}</p>
            <p><strong>Address:</strong> ${donor.address}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Initially render empty (no donors yet)
    renderDonors(donors);

    // Later, Home page can push new donor objects to this array
    // Example:
    // donors.push({photo:"url", name:"", age:30, occupation:"", address:""});
    // renderDonors(donors);
  </script>

</body>
</html>
