<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donors - Manitham Trust</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f9f9f9;
    color: #222;
  }

  .title {
    text-align: center;
    font-size: 48px;
    font-weight: bold;
    padding: 25px 0;
    color: #2c3e50;
    letter-spacing: 3px;
    background-color: #ecf0f1;
  }

  .back-btn-container {
    text-align: center;
    margin: 10px 0;
  }

  .back-btn {
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    transition: 0.3s;
  }

  .back-btn:hover {
    background-color: #2980b9;
  }

  .form-container {
    max-width: 900px;
    margin: 20px auto;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
  }

  .form-container input {
    margin: 5px 0;
    padding: 8px;
    width: 100%;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  .form-container label {
    font-weight: bold;
    margin-top: 10px;
    display: block;
  }

  .form-container button {
    margin-top: 15px;
    padding: 10px 20px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background-color: #27ae60;
    color: white;
    cursor: pointer;
  }

  .form-container button:hover {
    background-color: #1e8449;
  }

  .donor-table {
    max-width: 1000px;
    margin: 20px auto;
    border-collapse: collapse;
    width: 100%;
  }

  .donor-table th, .donor-table td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
  }

  .donor-table th {
    background-color: #27ae60;
    color: white;
  }

  .donor-photo {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid #27ae60;
  }
</style>
</head>
<body>

<div class="title">Donors - Manitham Trust</div>

<div class="back-btn-container">
  <button class="back-btn" onclick="location.href='index.html'">← Back to Dashboard</button>
</div>

<div class="form-container">
  <h2>Add Donor</h2>
  <label for="photo">Photo URL:</label>
  <input type="text" id="photo" placeholder="Paste image URL">

  <label for="name">Name:</label>
  <input type="text" id="name" placeholder="Donor Name">

  <label for="age">Age:</label>
  <input type="number" id="age" placeholder="Donor Age">

  <label for="occupation">Occupation:</label>
  <input type="text" id="occupation" placeholder="Donor Occupation">

  <label for="address">Address:</label>
  <input type="text" id="address" placeholder="Donor Address">

  <button onclick="addDonor()">Add Donor</button>
</div>

<table class="donor-table" id="donorTable">
  <thead>
    <tr>
      <th>Photo</th>
      <th>Name</th>
      <th>Age</th>
      <th>Occupation</th>
      <th>Address</th>
    </tr>
  </thead>
  <tbody>
    <!-- Donors will be added here -->
  </tbody>
</table>

<script>
function addDonor() {
  const photo = document.getElementById('photo').value;
  const name = document.getElementById('name').value;
  const age = document.getElementById('age').value;
  const occupation = document.getElementById('occupation').value;
  const address = document.getElementById('address').value;

  if(!photo || !name || !age || !occupation || !address){
    alert("Please fill all fields!");
    return;
  }

  const tableBody = document.getElementById('donorTable').getElementsByTagName('tbody')[0];

  const row = document.createElement('tr');
  row.innerHTML = `
    <td><img src="${photo}" alt="${name}" class="donor-photo"></td>
    <td>${name}</td>
    <td>${age}</td>
    <td>${occupation}</td>
    <td>${address}</td>
  `;

  tableBody.appendChild(row);

  // Clear form
  document.getElementById('photo').value = '';
  document.getElementById('name').value = '';
  document.getElementById('age').value = '';
  document.getElementById('occupation').value = '';
  document.getElementById('address').value = '';
}
</script>

</body>
</html>
